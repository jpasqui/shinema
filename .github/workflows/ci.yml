name: First slice checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  javascript-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint && npm run format:check
      - run: npm run test:core && npm run typecheck:core
      - run: node --test scripts/libraries-diagnostics.test.mjs
      - run: python3 scripts/test_ci_artifacts.py
  web-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: rustup toolchain install 1.94.0 --profile minimal
      - name: Cache Rust dependencies and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-web-rust-1.94.0-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'packages/contracts/content-registry.json') }}
          restore-keys: ${{ runner.os }}-web-rust-1.94.0-${{ hashFiles('Cargo.lock') }}-
      - run: cargo +1.94.0 build --workspace --locked
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: clients/web
      - run: npm test && npm run build
        working-directory: clients/web
      - name: Audit web development build
        run: python3 scripts/audit_ci_artifacts.py web clients/web/dist
      - name: Save web development build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-web-development-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            clients/web/dist/
            clients/web/node_modules/react/LICENSE
            clients/web/node_modules/react-dom/LICENSE
            docs/ci-builds.md
            docs/dependency-licenses.md
            docs/web-dependency-licenses.json
            LICENSE
          if-no-files-found: error
          retention-days: 14
      - run: node clients/web/node_modules/playwright/cli.js install --with-deps chromium
      - name: Mocked Radarr and Sonarr request flow
        run: node scripts/requests-smoke.mjs
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Isolated client playback regressions
        id: playback-regressions
        run: npm --prefix clients/web run test:playback
      - name: Configurable library and navigation regressions
        id: libraries-regressions
        run: node scripts/libraries-smoke.mjs
        env:
          SHINEMA_LIBRARIES_SKIP_BEFORE: '1'
          SHINEMA_EVIDENCE_PAUSE_MS: '0'
      - name: Audit library failure diagnostics
        id: audit-library-diagnostics
        if: failure() && steps.libraries-regressions.outcome == 'failure'
        run: python3 scripts/audit_ci_artifacts.py libraries-diagnostics ci-artifacts/libraries-failure
      - name: Save library failure diagnostics
        if: failure() && steps.audit-library-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-libraries-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts/libraries-failure/
          if-no-files-found: error
          retention-days: 7
      - name: Audit playback failure diagnostics
        id: audit-playback-diagnostics
        if: failure() && steps.playback-regressions.outcome == 'failure'
        run: python3 scripts/audit_ci_artifacts.py playback-diagnostics ci-artifacts/playback-failure
      - name: Save playback failure diagnostics
        if: failure() && steps.audit-playback-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-playback-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts/playback-failure/
          if-no-files-found: error
          retention-days: 7
      - run: node scripts/generate-test-media.mjs
      - name: Check out pinned public before-client source for comparison
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: c2d82902fab5fc9e4e16555d5978df943f5ab865
          path: local-tools/pr5-before
          persist-credentials: false
      - name: Browser smoke with retained failure logs
        id: browser-smoke
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-artifacts/browser-failure
          node scripts/web-smoke.mjs 2>&1 | tee ci-artifacts/browser-failure/browser-test.log
          node scripts/full-library-smoke.mjs 2>&1 | tee -a ci-artifacts/browser-failure/browser-test.log
        env:
          SHINEMA_PUBLIC_EVIDENCE: '1'
          SHINEMA_BEFORE_UI_ROOT: local-tools/pr5-before
          SHINEMA_SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Audit generated public UI evidence
        run: python3 scripts/audit_ci_artifacts.py public-fixtures ci-artifacts/public-fixtures
      - name: Save generated public UI evidence
        id: public-evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-generated-ui-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts/public-fixtures/
          if-no-files-found: error
          retention-days: 14
      - name: Link generated evidence in run summary
        env:
          ARTIFACT_URL: ${{ steps.public-evidence.outputs.artifact-url }}
        run: |
          echo "Generated-only before/after screenshots and silent, untrimmed desktop workload recording (not TV validation): $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Audit browser failure diagnostics
        id: audit-diagnostics
        if: failure() && steps.browser-smoke.outcome == 'failure'
        run: python3 scripts/audit_ci_artifacts.py diagnostics ci-artifacts/browser-failure
      - name: Save browser failure diagnostics
        if: failure() && steps.audit-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-browser-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts/browser-failure/
          if-no-files-found: error
          retention-days: 7
  server-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: clients/native/package-lock.json
      - run: rustup toolchain install 1.94.0 --profile minimal --component rustfmt,clippy
      - name: Cache Rust dependencies and build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-server-rust-1.94.0-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml', 'packages/contracts/content-registry.json') }}
          restore-keys: ${{ runner.os }}-server-rust-1.94.0-${{ hashFiles('Cargo.lock') }}-
      - run: cargo +1.94.0 fmt --all --check
      - run: cargo +1.94.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.94.0 test --workspace --locked
      # cargo test regenerates the client types from the Rust API structs.
      - name: Save generated client types
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-generated-types-${{ github.event.pull_request.head.sha || github.sha }}
          path: packages/core/src/generated/
          if-no-files-found: ignore
          retention-days: 14
      - name: Generated client types match the server
        run: |
          if [ -n "$(git status --porcelain -- packages/core/src/generated)" ]; then
            git status --porcelain -- packages/core/src/generated
            echo "Client types are out of date. Commit packages/core/src/generated from this run's artifact (or run cargo test locally)."
            exit 1
          fi
      - name: Synthetic remote reader policy regressions
        run: python3 -m unittest discover -s server/tests -p 'test_remote_reader.py'
      - run: cargo +1.94.0 build --workspace --locked
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: clients/native
      - run: npm test && npm run typecheck
      - run: node scripts/host-smoke.mjs
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: clients/native/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: microsoft
          java-version: '21'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.4.1'
      - name: Install exact Android SDK packages
        run: |
          SDKMANAGER="${ANDROID_HOME:?}/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.30.5'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: clients/native
      # React Native otherwise embeds the runner's host IP in a debugger resource.
      - run: gradle --no-daemon :app:assembleRelease -PreactNativeDevServerIp=127.0.0.1
        working-directory: clients/native/android
        env:
          CI: 'true'
      - name: Audit unsigned Android development APK
        run: python3 scripts/audit_ci_artifacts.py android clients/native/android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Save unsigned Android development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-android-unsigned-development-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            clients/native/android/app/build/outputs/apk/release/app-release-unsigned.apk
            docs/ci-builds.md
            docs/dependency-licenses.md
            LICENSE
          if-no-files-found: error
          retention-days: 14
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/shinema/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/shinema
      - run: npm run typecheck && npm test
        working-directory: apps/shinema
      - run: npx expo export --platform web --output-dir dist
        working-directory: apps/shinema
        env:
          CI: 'true'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate a synthetic test clip
        run: ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24:duration=30 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 30 -c:a aac -b:a 64k -movflags +faststart -shortest "$RUNNER_TEMP/fixture.mp4"
      - run: npx playwright install --with-deps chromium
        working-directory: apps/shinema
      - name: Browser behaviour at TV and desktop sizes
        run: npm run test:e2e
        working-directory: apps/shinema
        env:
          SHINEMA_MOCK_VIDEO: ${{ runner.temp }}/fixture.mp4
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-app-screens-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/shinema/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Save web build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-app-web-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/shinema/dist/
          if-no-files-found: error
          retention-days: 14
  app-android-tv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/shinema/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: microsoft
          java-version: '17'
      - run: npm ci --no-audit --no-fund
        working-directory: apps/shinema
      # Generates the Android TV project (leanback launcher, TV banner) from app.json.
      - run: npx expo prebuild --platform android --no-install --clean
        working-directory: apps/shinema
        env:
          EXPO_TV: '1'
          CI: 'true'
      - run: ./gradlew --no-daemon assembleRelease -PreactNativeDevServerIp=127.0.0.1
        working-directory: apps/shinema/android
        env:
          CI: 'true'
      - name: Save Android TV development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-app-android-tv-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/shinema/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
  app-android-phone:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: apps/shinema/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: microsoft
          java-version: '17'
      - run: npm ci --no-audit --no-fund
        working-directory: apps/shinema
      # The same app without EXPO_TV: a touch-screen phone and tablet build.
      - run: npx expo prebuild --platform android --no-install --clean
        working-directory: apps/shinema
        env:
          CI: 'true'
      - run: ./gradlew --no-daemon assembleRelease -PreactNativeDevServerIp=127.0.0.1
        working-directory: apps/shinema/android
        env:
          CI: 'true'
      - name: Save Android phone development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-app-android-phone-${{ github.event.pull_request.head.sha || github.sha }}
          path: apps/shinema/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
  app-android-tv-screens:
    needs: app-android-tv
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: shinema-app-android-tv-${{ github.event.pull_request.head.sha || github.sha }}
          path: apk
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Generate a synthetic test clip
        run: ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=24:duration=30 -f lavfi -i sine=frequency=440:duration=30 -c:v libx264 -pix_fmt yuv420p -preset veryfast -crf 30 -c:a aac -b:a 64k -movflags +faststart -shortest "$RUNNER_TEMP/fixture.mp4"
      - name: Start the mock server
        run: nohup node apps/shinema/tests/mock-server.mjs 8790 >"$RUNNER_TEMP/mock.log" 2>&1 &
        env:
          SHINEMA_MOCK_VIDEO: ${{ runner.temp }}/fixture.mp4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive the Android TV build with a D-pad
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash apps/shinema/tests/android-tv-screens.sh "$(ls apk/*.apk | head -1)" apps/shinema/test-results/android-tv
      - name: Save Android TV screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-app-android-tv-screens-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            apps/shinema/test-results/android-tv/
            ${{ runner.temp }}/mock.log
          if-no-files-found: ignore
          retention-days: 14
