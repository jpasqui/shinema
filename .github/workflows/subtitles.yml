name: Synthetic subtitle playback
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: subtitles-${{ github.ref }}
  cancel-in-progress: true
jobs:
  subtitle-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: clients/web/package-lock.json
      - run: rustup toolchain install 1.94.0 --profile minimal
      - run: cargo +1.94.0 build --workspace --locked
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: clients/web
      - run: node clients/web/node_modules/playwright/cli.js install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node --test scripts/subtitle-diagnostics.test.mjs
      - run: cargo +1.94.0 test --workspace --locked generated_embedded_formats -- --ignored --nocapture
      - name: Synthetic subtitle browser smoke
        id: subtitle-smoke
        run: node scripts/subtitle-smoke.mjs
      - name: Audit subtitle failure diagnostics
        id: audit-subtitle-diagnostics
        if: failure() && steps.subtitle-smoke.outcome == 'failure'
        run: python3 scripts/audit_ci_artifacts.py subtitle-diagnostics ci-artifacts/subtitle-failure
      - name: Save subtitle failure diagnostics
        if: failure() && steps.audit-subtitle-diagnostics.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: shinema-subtitle-failure-${{ github.event.pull_request.head.sha || github.sha }}
          path: ci-artifacts/subtitle-failure/
          if-no-files-found: error
          retention-days: 7
